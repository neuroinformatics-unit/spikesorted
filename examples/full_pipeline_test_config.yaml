bad_channel_detection:
  method: coherence+psd

raw_data_quality_metrics:
  # Short windows for the 0.5-second example recording.
  chunk_size_s: 0.1
  num_chunks: 4
  rolling_rms_window_size_s: 0.1
  compute_raw_rolling_rms: true

artifact_detection:
  saturation: {}

preprocessing:
  save_preprocessed_copy: true
  remove_bad_channels: {}
  phase_shift: {}
  bandpass_filter:
    freq_min: 300.0
    freq_max: 6000.0
  common_reference:
    reference: global
    operator: median
  silence_periods:
    mode: zeros

sorting:
  sorter: mountainsort5
  params:
    scheme: "1"  # Avoid classifier training on the 0.5-second example.
    filter: false  # The pipeline has already filtered the recording.

postprocessing:
  random_spikes:
    max_spikes_per_unit: 2500
  waveforms:
    ms_before: 1.0
    ms_after: 2.0
  templates: {}
  principal_components:
    n_components: 5
    mode: by_channel_local
    whiten: true
  noise_levels: {}
  spike_amplitudes: {}
  spike_locations: {}
  unit_locations: {}
  template_similarity: {}
  correlograms: {}
  isi_histograms: {}
  template_metrics: {}
  quality_metrics:
    metric_names: all
  compute_sparsity:
    method: radius
    radius_um: 100
