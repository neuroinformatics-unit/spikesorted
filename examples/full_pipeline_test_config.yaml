output:
  structure: neuroblueprint

bad_channel_detection:
  method: coherence+psd

raw_data_quality_metrics:
  # Short windows for the 0.5-second example recording.
  chunk_size_s: 0.1
  num_chunks: 4
  rolling_rms_window_size_s: 0.1
  compute_raw_rolling_rms: true

artifact_detection:
  saturation: {}

preprocessing:
  remove_bad_channels: {}
  phase_shift: {}
  bandpass_filter:
    freq_min: 300.0
    freq_max: 6000.0
  common_reference:
    reference: global
    operator: median
  silence_periods:
    mode: zeros
